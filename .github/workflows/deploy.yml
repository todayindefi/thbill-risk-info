name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # No `schedule:` trigger. It ran at :30 and only ever redeployed the tree that
  # sync_and_push.sh had already pushed at :23, which `on: push` deploys anyway.
  # Two arrivals per hour into a single-slot concurrency queue is what turned one
  # stuck run into a 5.4-day outage on 2026-08-06 — see the concurrency note below.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # GitHub's own Pages template ships `false` so a production deploy is never
  # interrupted mid-flight. That reasoning does not hold here: this publishes a
  # data snapshot where only the newest matters, and an interrupted deploy costs
  # nothing because the next hourly sync pushes again.
  #
  # What `false` cost instead: run 31119642089 wedged in `waiting` on 2026-08-06
  # held this group indefinitely. GitHub queues at most one run per group, so
  # every new arrival evicted the previously queued one — 99 of 100 consecutive
  # runs cancelled before allocating a runner, zero deploys, and the live site
  # served 5.4-day-old risk data while `main` was correct the whole time.
  #
  # `true` makes a wedged run cost one cycle instead of every cycle after it.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retry 1
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry 1)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retry 2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: sleep 90

      - name: Deploy to GitHub Pages (retry 2 - final)
        id: deployment_retry2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v4
